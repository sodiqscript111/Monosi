apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monosi-manager-role
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - sharding.monosi.io
    resources:
      - shuffleshardassignments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - sharding.monosi.io
    resources:
      - shuffleshardassignments/finalizers
    verbs:
      - update
  - apiGroups:
      - sharding.monosi.io
    resources:
      - shuffleshardassignments/status
    verbs:
      - get
      - patch
      - update
