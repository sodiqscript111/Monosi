apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: shuffleshardassignments.sharding.monosi.io
spec:
  group: sharding.monosi.io
  names:
    kind: ShuffleShardAssignment
    listKind: ShuffleShardAssignmentList
    plural: shuffleshardassignments
    singular: shuffleshardassignment
    shortNames:
      - ssa
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantID
        - name: AssignedShards
          type: string
          jsonPath: .status.assignedShards
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: ShuffleShardAssignment manages deterministic shard assignment for multi-tenant workload isolation.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - tenantID
              properties:
                tenantID:
                  type: string
                  minLength: 1
                  description: Unique identifier for the tenant, used to deterministically seed shard selection.
                shardPoolSize:
                  type: integer
                  minimum: 1
                  default: 8
                  description: Total pool size (N) of shards.
                shardsPerTenant:
                  type: integer
                  minimum: 1
                  default: 2
                  description: Number of shards (k) assigned to this tenant.
                nodeSelectorKey:
